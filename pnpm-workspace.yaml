ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
# Versions corrigées de sous-dépendances du CLI Prisma (@prisma/config), pour `pnpm audit --prod` sans
# vulnérabilité haute : effect (GHSA-7589-6fvf-x4pw) et deepmerge-ts (stack exhaustion).
overrides:
  effect: ">=3.22.1 <4"
  deepmerge-ts: "^8.0.0"
