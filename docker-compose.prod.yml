# Stack de production pour Dokploy (type "Docker Compose").
#
# Dans Dokploy :
#   - Compose Path : ./docker-compose.prod.yml
#   - Environment  : voir .env.prod.example (DB_PASSWORD, SESSION_SECRET, Discord, SITE_URL)
#   - Domains      : service "app", port 3000 (Dokploy ajoute lui-même les labels Traefik + HTTPS)
#
# L'image est construite par Dokploy à partir du Dockerfile du dépôt.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://webmap:${DB_PASSWORD}@db:5432/webmap
      SESSION_SECRET: ${SESSION_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Anciens noms, toujours acceptés par l'app (déploiements existants)
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_ALLOWED_ROLES: ${DISCORD_ALLOWED_ROLES:-}
      SITE_URL: ${SITE_URL:-}
      APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webmap
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: webmap
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmap -d webmap"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de `ports:` : la base n'est joignable que par l'app, jamais depuis l'extérieur.

volumes:
  db-data:
